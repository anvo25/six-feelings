<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Feelings: redirecting</title>
<meta name="robots" content="noindex">
<style>
  body{font:17px/1.55 Georgia,"Times New Roman",serif;margin:14vh auto;max-width:34rem;padding:0 1.25rem;color:#1d1b18;background:#f4efe6}
  h1{font-size:2.4rem;line-height:1.05;margin:0 0 .6em;letter-spacing:-.02em}
  h1 em{color:#b5351c;font-weight:400}
  a{color:#b5351c}
  .muted{color:#6b655c;font-size:.9em;font-family:ui-monospace,Menlo,Consolas,monospace}
  @media (prefers-color-scheme:dark){body{background:#151311;color:#ece6da}h1 em,a{color:#ff8061}.muted{color:#9a9285}}
</style>
<h1>Six <em>Feelings</em></h1>
<p>Taking you to the emotion labeling study…</p>
<p><a id="go" href="https://material-numerous-sure-indoor.trycloudflare.com">If nothing happens, click here.</a></p>
<p class="muted">Bookmark this page, not the address it sends you to. The destination changes; this page does not.</p>
<script>
  // GitHub Pages lets browsers cache this page for 10 minutes, so the address baked into the
  // link above can be stale right after a tunnel restart. target.txt is fetched fresh on every
  // visit (cache-busting query) and wins; the baked-in address is only the fallback.
  // Anything after "#/" is forwarded, e.g. .../six-feelings/#/admin?key=... -> <tunnel>/admin?key=...
  // (the fragment never reaches GitHub's servers, so a key placed there is not logged by them).
  var link = document.getElementById('go'), fallback = link.getAttribute('href');
  var extra = location.hash.indexOf('#/') === 0 ? location.hash.slice(1) : '';
  var done = false;
  function go(base) {
    if (done) return; done = true;
    if (base.indexOf('https://') !== 0) return;          // still the unfilled template
    link.setAttribute('href', base + extra);
    location.replace(base + extra);
  }
  var timer = setTimeout(function () { go(fallback); }, 2500);
  fetch('target.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : Promise.reject(); })
    .then(function (t) {
      t = t.trim(); clearTimeout(timer);
      go(/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(t) ? t : fallback);
    })
    .catch(function () { clearTimeout(timer); go(fallback); });
</script>
</html>
